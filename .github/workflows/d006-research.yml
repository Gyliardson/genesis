name: D-006 research correctness (PR 26 only)

# No pull_request_target, secrets, elevated token, self-hosted runner or production dependencies.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feat/g005-deterministic-core-action-a]
    paths:
      - "benchmarks/d006/**"
      - ".github/workflows/d006-research.yml"

permissions:
  contents: read

concurrency:
  group: d006-research-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  adapter-correctness:
    if: >-
      github.event.pull_request.number == 26 &&
      github.event.pull_request.head.repo.full_name == 'Gyliardson/genesis' &&
      github.event.pull_request.head.ref == 'research/d006-simpy-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE: "f39ed8a2cf10febc8affc0525c29e4a6a25b9be7"
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      PYTHONPATH: "src:benchmarks/d006"
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify exact source and supported runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          python -c 'import sys; assert sys.version_info[:2] == (3, 11)'
          printf 'D006_CANDIDATE_SHA=%s\nD006_CORE_BASE_SHA=%s\n' "$EXPECTED_HEAD" "$EXPECTED_BASE"
          python --version
          uname -a
      - name: Install research-only hash-pinned SimPy
        run: |
          set -euo pipefail
          python -m pip --isolated install --no-input --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r benchmarks/d006/requirements-research.txt
          python -c 'import simpy; assert simpy.__version__ == "4.1.2"; print("SIMPY_VERSION=" + simpy.__version__)'
      - name: Independent oracles against both engines
        env:
          D006_ORACLE_MODE: dual
        run: python -m unittest discover -s benchmarks/d006 -p oracle_tests.py -v
      - name: Live adapter COMPLETE-dispatch mutation regression
        run: python -m unittest discover -s benchmarks/d006 -p dispatch_mutation_test.py -v
      - name: Differential 16 golden, 4 negative, 64 seeds (374 executed variants)
        run: python benchmarks/d006/simpy_adapter_benchmark.py
