name: CI

# pull_request (not pull_request_target) keeps code from forks on the unprivileged path.
on:
  # Allows a first trusted CI run after authorized private-to-public conversion.
  # Visibility conversion alone does not emit push/pull_request events.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (without persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify supported platform
        run: |
          test "$(uname -m)" = x86_64
          python -c 'import sys; assert sys.version_info[:2] == (3, 11)'
      - name: Install pinned wheel dependencies with hashes
        run: python -m pip --isolated install --no-input --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r requirements/ci-py311-ubuntu24.04-x86_64.txt
      - name: Build and install checked-out GENESIS wheel offline
        run: |
          mkdir -p "${RUNNER_TEMP}/genesis-wheel"
          python -m pip wheel --no-index --no-deps --no-build-isolation -w "${RUNNER_TEMP}/genesis-wheel" .
          python -m pip install --no-index --no-deps "${RUNNER_TEMP}"/genesis-wheel/genesis_ai_lab-*.whl
      - name: Ruff lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Verify dependencies
        run: python -m pip check
